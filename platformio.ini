	adafruit/Adafruit LSM303 Accel@^1.1.9
	adafruit/Adafruit LSM303DLH Mag@^1.0.11
	adafruit/Adafruit L3GD20 U@^2.0.3
	hideakitai/ArduinoEigen@^0.3.2
	nhz2/XYZgeomag@^2.1.0
